<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="facebook-domain-verification" content="nm447ky37r5j1pm23rr9jbk3n9z2wc" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black/50 flex items-center justify-center min-h-screen">

<!-- MODAL -->
<div class="bg-white w-[90%] max-w-sm rounded-2xl shadow-2xl p-6 relative text-center">

    <!-- CLOSE BUTTON -->
    <button onclick="goBack()" 
        class="absolute top-3 right-3 text-gray-400 hover:text-black text-xl">
        ✕
    </button>

    <!-- TITLE -->
    <h2 class="text-xl font-semibold mb-1">Verify OTP</h2>

    <p class="text-sm text-gray-500">OTP sent to</p>
    <p class="text-sm font-semibold text-black mt-1">
        +91 {{ phone }}
    </p>

    {% if error %}
        <p class="text-red-500 text-sm mt-3">{{ error }}</p>
    {% endif %}

    <!-- FORM -->
    <form method="POST" action="{% url 'verify_cod_otp' %}" class="mt-4">
        {% csrf_token %}

        <input
            type="text"
            name="otp"
            maxlength="6"
            placeholder="Enter OTP"
            required
            class="w-full border border-gray-300 rounded-xl py-3 text-center text-lg
                   focus:outline-none focus:ring-2 focus:ring-black transition"
        >

        <button
            type="submit"
            class="w-full mt-4 bg-black text-white py-3 rounded-xl font-semibold
                   hover:bg-gray-800 transition"
        >
            Verify & Place Order
        </button>
    </form>

<!-- TIMER -->
<div class="mt-4 text-center">

    <p id="timerText" class="text-sm text-gray-500">
        Resend OTP in <span id="timer">10:00</span>
    </p>

    <button
        id="resendBtn"
        onclick="reloadPage()"
        class="hidden mt-3 w-full border border-black text-black py-3 rounded-xl font-semibold hover:bg-black hover:text-white transition"
    >
        Resend OTP
    </button>

</div>

</div>

<script>

function goBack() {
    window.history.back();
}

function reloadPage() {
    window.location.reload();
}

// 10 MINUTE TIMER
let totalSeconds = 10 * 60;

const timer = document.getElementById("timer");
const timerText = document.getElementById("timerText");
const resendBtn = document.getElementById("resendBtn");

const countdown = setInterval(() => {

    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;

    seconds = seconds < 10 ? "0" + seconds : seconds;

    timer.innerText = `${minutes}:${seconds}`;

    if (totalSeconds <= 0) {

        clearInterval(countdown);

        timerText.classList.add("hidden");

        resendBtn.classList.remove("hidden");
    }

    totalSeconds--;

}, 1000);

</script>
